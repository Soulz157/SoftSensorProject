# ---------------------------------------------------------------------------
# Security — deep scans that are too slow for the PR path.
# Runs nightly so a CVE published after merge is still caught.
# ---------------------------------------------------------------------------
name: Security

on:
    schedule:
        - cron: "0 18 * * *" # 01:00 ICT
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: security-${{ github.ref }}
    cancel-in-progress: true

jobs:
    codeql:
        name: CodeQL (${{ matrix.language }})
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
            security-events: write
            actions: read
        strategy:
            fail-fast: false
            matrix:
                language: [javascript-typescript, python]
        steps:
            - uses: actions/checkout@v4
            - uses: github/codeql-action/init@v3 # TODO: pin to commit SHA
              with:
                  languages: ${{ matrix.language }}
                  queries: security-extended
            - uses: github/codeql-action/analyze@v3
              with:
                  category: /language:${{ matrix.language }}

    dependencies:
        name: Dependency audit
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/setup-node
              with:
                  node-version: "20"

            - name: pnpm audit
              run: pnpm audit --audit-level=high --prod

            - uses: ./.github/actions/setup-python
              with:
                  python-version: "3.12"
                  working-directory: services/connector

            - name: pip-audit
              working-directory: services/connector
              run: pip-audit --strict

    filesystem:
        name: Repo scan (Trivy fs)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@v4
            - uses: aquasecurity/trivy-action@master # TODO: pin to a release SHA
              with:
                  scan-type: fs
                  scanners: vuln,secret,misconfig
                  format: sarif
                  output: trivy-fs.sarif
                  severity: HIGH,CRITICAL
            - uses: github/codeql-action/upload-sarif@v3
              with:
                  sarif_file: trivy-fs.sarif
                  category: trivy-fs

    actions-hardening:
        name: Workflow hardening check
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - name: Fail on unpinned third-party actions
              run: |
                  set -euo pipefail
                  # First-party actions/*, github/*, docker/* are still safer pinned, but
                  # everything else MUST be pinned to a 40-char commit SHA.
                  bad=$(grep -rnE '^\s*(- )?uses:\s+[^./]' .github/workflows .github/actions \
                        | grep -vE '@[0-9a-f]{40}' \
                        | grep -vE 'uses:\s+(actions|github|docker)/' || true)
                  if [ -n "$bad" ]; then
                    echo "::warning::Unpinned actions found:"
                    echo "$bad"
                  fi
            - name: actionlint
              uses: raven-actions/actionlint@v2 # TODO: pin to commit SHA

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Object storage for dataset version artifacts (Parquet). This service was
  # already running locally as `minio-local` while this block stayed commented
  # out, so a fresh clone got no MinIO. Uncommented to make the environment
  # reproducible — it documents what already exists rather than adding a new
  # service. Credentials come from .env (S3_*) instead of being hardcoded.
  minio:
    image: quay.io/minio/minio
    container_name: minio-local
    restart: unless-stopped
    # Deliberately NOT `env_file: .env` — that injects every app secret
    # (NEXTAUTH_SECRET, JWT_*, DATABASE_URL) into the storage container.
    # Compose interpolates ${...} from .env on its own, so only these two land.
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

